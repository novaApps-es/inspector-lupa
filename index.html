<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<meta name="theme-color" content="#17323f">
<title>Inspector Lupa</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Inspector Lupa">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<style>
@font-face{font-family:"Fredoka";font-weight:500;font-display:swap;src:url(fredoka-latin-500-normal.woff2) format("woff2")}
@font-face{font-family:"Fredoka";font-weight:700;font-display:swap;src:url(fredoka-latin-700-normal.woff2) format("woff2")}
@font-face{font-family:"Patrick Hand";font-weight:400;font-display:swap;src:url(patrick-hand-latin-400-normal.woff2) format("woff2")}
/* VOICE: juego de detective de pueblo, amable y con humor; pistas a mano en la libreta
   IDEA: la mesa del inspector: carpeta del caso, fichas de sospechosos, libreta cuadriculada
   PICTURE: escena ilustrada del lugar del suceso (de día en Villaluz, de noche en la feria) y retratos por código
   COLOUR and TYPE: mesa azul petróleo (de noche, violeta), papel blanco, mostaza y rojo de marcador; Fredoka + Patrick Hand
   LAYOUT: escena arriba a todo el ancho; en tablet horizontal, caso a la izquierda y pistas + libreta a la derecha */
:root{--desk:#17323f;--desk2:#21485a;--paper:#fdfcf8;--ink:#1d2b33;--line:#cfe0ea;--mos:#f2b134;--rojo:#d64933;--verde:#2f9e6e;--gris:#8a9aa3;--boton:#2c5a6e}
*{box-sizing:border-box;min-width:0;-webkit-tap-highlight-color:transparent}
html{min-height:100%;background:radial-gradient(circle at 30% 0,var(--desk2),var(--desk) 900px) var(--desk)}
body{margin:0;color:var(--ink);font:16px/1.45 "Fredoka","Trebuchet MS",system-ui,sans-serif;overflow-x:clip}
:root.noche{--desk:#140f2e;--desk2:#3b2d6b;--boton:#4a3d86}
button{font:inherit;cursor:pointer;border:none;color:inherit}
.screen{display:none;min-height:100vh}.screen.on{display:block}
.btn{background:var(--mos);color:#3a2600;font-weight:700;font-size:18px;padding:12px 26px;border-radius:14px;box-shadow:0 4px 0 #b37a12;min-height:44px}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 #b37a12}
.btn.sec{background:#e7eef2;color:var(--ink);box-shadow:0 4px 0 #9fb2bd}
.btn.rojo{background:var(--rojo);color:#fff;box-shadow:0 4px 0 #8e2a1c}
.btn:disabled{opacity:.45;cursor:default}
/* MENÚ */
#menu{text-align:center;padding:40px 16px;color:#fff}
#menu svg{width:min(240px,56vw);height:auto;filter:drop-shadow(0 12px 18px rgba(0,0,0,.35))}
#menu h1{font-size:clamp(42px,10vw,68px);line-height:1.05;margin:8px 0 4px;color:var(--mos);text-shadow:0 4px 0 #8a5a00}
#menu p{margin:0 0 22px;color:#cfe0ea;font-size:18px}
#menu .col{display:flex;flex-direction:column;align-items:center;gap:14px}
#instalar{display:none}#iosTip{display:none;max-width:360px;margin:6px auto 0;font-size:15px;color:#cfe0ea;background:rgba(255,255,255,.08);border-radius:12px;padding:10px 14px}
#menu .ver{margin-top:28px;font-size:13px;color:#8fb0c0}
/* MAPA */
#map{padding:18px 14px 40px;color:#fff}
.mapTop{display:flex;justify-content:space-between;align-items:center;max-width:900px;margin:0 auto}
.tabs{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin:16px 0 4px}
.tab{padding:10px 18px;border-radius:12px;background:var(--boton);color:#fff;font-weight:700;min-height:44px}
.tab.on{background:var(--mos);color:#3a2600}
.tab sup{background:var(--rojo);color:#fff;border-radius:6px;padding:0 5px;font-size:11px;margin-left:4px}
#map h2{text-align:center;margin:10px 0 2px;font-size:32px;color:var(--mos)}
#map .sub{text-align:center;color:#cfe0ea;margin:0 auto 18px;max-width:620px}
#casos{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:16px 14px;max-width:900px;margin:0 auto}
.carp{position:relative;background:#e9c98b;border-radius:4px 14px 10px 10px;padding:22px 12px 12px;text-align:left;color:#3a2600;min-height:118px;
 box-shadow:0 6px 0 #a7834a,0 10px 18px rgba(0,0,0,.3)}
.carp::before{content:"";position:absolute;top:-10px;left:0;width:56%;height:14px;background:inherit;border-radius:8px 8px 0 0}
.carp b{display:block;font-size:20px}.carp small{display:block;color:#6e5226;font-size:13px;line-height:1.25}
.carp .st{font-size:20px;color:#b08a4a;letter-spacing:2px;margin-top:6px}.carp .st i{font-style:normal;color:var(--rojo)}
.carp.c2{background:#cdb9f5;box-shadow:0 6px 0 #7d63c0,0 10px 18px rgba(0,0,0,.35)}.carp.c2 small{color:#4b3787}
.carp.lock{background:#8a9aa3;box-shadow:0 6px 0 #5d6b73;color:#3d4a51;cursor:default}.carp.lock small{color:#3d4a51}
.carp.fin{background:#c7d8a8;box-shadow:0 6px 0 #7f9658}
.carp.act{outline:3px solid var(--mos);outline-offset:3px}
/* CASO */
.top{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:10px;padding:10px 12px;background:color-mix(in srgb,var(--desk) 94%,transparent);color:#fff;backdrop-filter:blur(4px)}
.top .tt{flex:1;line-height:1.15}.top small{color:#b9cfe0;font-size:13px}.top b{display:block;font-size:19px}
.icb{width:44px;height:44px;border-radius:12px;background:var(--boton);color:#fff;font-size:22px;font-weight:700;flex:none}
#cEst{font-size:20px;letter-spacing:2px;color:#6d7f9f;white-space:nowrap}#cEst i{font-style:normal;color:var(--mos)}
.pista{background:var(--boton);color:#fff;border-radius:12px;padding:0 14px;height:44px;font-weight:700;flex:none}
.cw{max-width:1180px;margin:0 auto;padding:12px 12px 40px;display:grid;gap:16px}
.scene{border-radius:16px;overflow:hidden;height:clamp(150px,25vw,250px);box-shadow:0 10px 24px rgba(0,0,0,.35);position:relative}
.scene svg{width:100%;height:100%;display:block}
@media(min-width:900px){.cw{grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);align-items:start}.scene{grid-column:1/-1}.colR{position:sticky;top:76px}}
.paper{background:var(--paper);border-radius:12px;padding:14px 16px;box-shadow:0 8px 18px rgba(0,0,0,.28)}
.story{border-left:8px solid var(--rojo)}
.story h3{margin:0 0 6px;font-size:22px}.story p{margin:0;font-size:17px}
.diario{font-family:"Patrick Hand","Comic Sans MS",cursive;font-size:20px;line-height:1.3;color:#5b4636;background:#fff3cf;border-radius:8px;padding:6px 12px;margin:0 0 10px!important}
.story .lugar{display:inline-block;margin-top:8px;background:#fde7a8;border-radius:8px;padding:3px 10px;font-weight:700}
.regla{background:#fde7e3;border:2px dashed var(--rojo);border-radius:10px;padding:8px 10px;margin-top:10px;font-weight:700;color:#8e2a1c}
.secT{color:#fff;margin:18px 2px 8px;font-size:20px}.secT small{color:#b9cfe0;font-size:13px;font-weight:500;margin-left:6px}
.plano{display:flex;flex-wrap:wrap;align-items:center;gap:6px;background:var(--paper);border-radius:12px;padding:10px 12px;box-shadow:0 8px 18px rgba(0,0,0,.28)}
.plano .ent{background:var(--verde);color:#fff;border-radius:8px;padding:4px 10px;font-weight:700}
.plano .pst{background:#fde7a8;border-radius:8px;padding:4px 10px;font-weight:700;white-space:nowrap}
.plano i{color:var(--gris);font-style:normal;font-weight:700}
.sus{display:grid;grid-template-columns:repeat(auto-fill,minmax(118px,1fr));gap:10px}
.card{background:var(--paper);border-radius:12px;padding:8px 6px 8px;text-align:center;position:relative;box-shadow:0 5px 0 #b9c9d1;transition:transform .15s}
.card svg{width:78px;height:78px;border-radius:50%;display:block;margin:0 auto 4px}
.card b{display:block;font-size:15px;line-height:1.1}.card small{display:block;color:#5d717b;font-size:13px;line-height:1.2}
.card .tr{font-size:13px;color:#2f4b58;margin-top:3px;line-height:1.25}
.card.off{opacity:.42;transform:scale(.96)}
.card.off::after{content:"✕";position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:96px;color:var(--rojo);font-weight:700;opacity:.9}
.decl{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.decl li{display:flex;gap:10px;align-items:center;background:var(--paper);border-radius:12px;padding:8px 12px;cursor:pointer;box-shadow:0 5px 0 #b9c9d1}
.decl svg{width:48px;height:48px;border-radius:50%;flex:none}
.decl b{font-size:14px;color:#5d717b}
.decl q{display:block;font-family:"Patrick Hand","Comic Sans MS",cursive;font-size:20px;line-height:1.25}
.decl li.tach q{text-decoration:line-through;color:#9aa8b0}
.clues{margin:0;padding:8px 14px 8px 44px;background:var(--paper) repeating-linear-gradient(transparent 0 33px,var(--line) 33px 34px) 0 8px;
 font-family:"Patrick Hand","Comic Sans MS",cursive;font-size:21px;line-height:34px;border-radius:12px;box-shadow:0 8px 18px rgba(0,0,0,.28);position:relative}
.clues::before{content:"";position:absolute;left:30px;top:0;bottom:0;width:2px;background:#f0a7a0}
.clues li{cursor:pointer;padding-left:4px}.clues li.tach{text-decoration:line-through;color:#9aa8b0}
.note{overflow-x:auto}
.gBox{display:inline-block;vertical-align:top;margin:0 10px 12px 0}
.gHead{display:flex;justify-content:space-between;align-items:center;gap:10px;color:#fff;margin:0 2px 6px;font-weight:700}
.borrar{background:var(--boton);color:#fff;border-radius:10px;padding:6px 14px;min-height:40px;font-weight:700;font-size:15px}
.grid{border-collapse:collapse;background:var(--paper);border-radius:12px;overflow:hidden;box-shadow:0 8px 18px rgba(0,0,0,.28)}
.grid th{font-size:13px;padding:6px 4px;background:#e7eef2;font-weight:700;text-align:center;line-height:1.1}
.grid th.rn{text-align:left;padding-left:10px;white-space:nowrap}
.grid td{border:1px solid #dfe7ec;padding:0}
.grid td button{width:52px;height:46px;background:none;font-size:24px;font-weight:700;display:block}
.grid td button.x{color:var(--rojo)}.grid td button.x.a{opacity:.5}.grid td button.ok{color:#fff;background:var(--verde)}
.acc{display:flex;justify-content:center;margin-top:16px}.acc .btn{font-size:22px;padding:14px 44px}
/* CANDADO */
.lockBox{display:flex;flex-direction:column;align-items:center;gap:14px}
.hintRow{display:flex;align-items:center;gap:12px;background:var(--paper);border-radius:12px;padding:8px 14px;box-shadow:0 5px 0 #b9c9d1;width:min(580px,100%)}
.dig{display:flex;gap:6px;flex:none}.dig span{width:40px;height:46px;border-radius:8px;background:#1d2b33;color:#fff;font-size:26px;font-weight:700;display:flex;align-items:center;justify-content:center}
.dig span svg{width:30px;height:30px}
.hintRow p{margin:0;font-family:"Patrick Hand",cursive;font-size:20px;line-height:1.2}
.safe{background:linear-gradient(#5d6f78,#3c4a51);border-radius:22px;padding:22px 22px;box-shadow:inset 0 2px 0 rgba(255,255,255,.2),0 12px 26px rgba(0,0,0,.4);display:flex;gap:12px}
.wheel{display:flex;flex-direction:column;align-items:center;gap:6px}
.wheel button{width:56px;height:44px;border-radius:10px;background:#2b363c;color:var(--mos);font-size:22px}
.wheel span{width:62px;height:76px;border-radius:12px;background:#111a1f;color:#ffe9a8;font-size:46px;font-weight:700;display:flex;align-items:center;justify-content:center;box-shadow:inset 0 4px 10px #000}
.wheel span svg{width:44px;height:44px}
/* MODAL */
#modal{position:fixed;inset:0;background:rgba(8,14,26,.62);display:none;align-items:center;justify-content:center;z-index:30;padding:14px}
#modal.on{display:flex}
#mbox{background:var(--paper);border-radius:18px;padding:18px;width:min(580px,100%);max-height:92vh;overflow:auto;text-align:center;box-shadow:0 18px 40px rgba(0,0,0,.45);animation:pop .2s ease-out}
@keyframes pop{from{transform:scale(.85);opacity:0}}
@media(prefers-reduced-motion:reduce){#mbox{animation:none}}
#mbox h3{margin:0 0 8px;font-size:26px}#mbox h4{margin:12px 0 4px;font-size:19px}
#mbox .bts{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:14px}
.estr{font-size:50px;letter-spacing:6px;color:#d5dde1}.estr i{font-style:normal;color:var(--mos)}
.pickS{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:8px;margin:8px 0}
.pickS button{background:#eef3f6;border-radius:12px;padding:6px 4px;font-size:13px;font-weight:700;border:3px solid transparent;min-height:44px}
.pickS button svg{width:56px;height:56px;border-radius:50%;display:block;margin:0 auto 2px}
.pickS button.sel,.pickO button.sel{border-color:var(--rojo);background:#fde7e3}
.pickO{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:6px 0}
.pickO button{background:#eef3f6;border-radius:20px;padding:8px 14px;font-weight:700;border:3px solid transparent;min-height:44px}
.msg{font-size:17px}
@media(max-width:600px){.top b{font-size:16px}.top .tt{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}.clues{font-size:19px}.decl q{font-size:18px}}
</style>
</head>
<body>

<section id="menu" class="screen on">
  <svg viewBox="0 0 200 200" aria-hidden="true">
    <ellipse cx="100" cy="186" rx="62" ry="8" fill="rgba(0,0,0,.3)"/>
    <rect x="122" y="118" width="22" height="64" rx="10" transform="rotate(-35 133 150)" fill="#7a4a1f"/>
    <circle cx="88" cy="96" r="52" fill="#cfe9f5" stroke="#f2b134" stroke-width="12"/>
    <circle cx="88" cy="96" r="52" fill="none" stroke="#b37a12" stroke-width="3"/>
    <path d="M60 80 q14-22 38-22" stroke="#fff" stroke-width="8" fill="none" stroke-linecap="round" opacity=".8"/>

  <h1>Inspector Lupa</h1>

  <div class="col">
    <button class="btn" id="bJugar" style="font-size:24px;padding:14px 48px">Jugar</button>
    <button class="btn sec" id="bDia">Caso del día</button>
    <button class="btn sec" id="bSon">Sonido: sí</button>
    <button class="btn sec" id="instalar">Instalar en este dispositivo</button>

<section id="map" class="screen">

    <span id="cEst"></span>
    <button class="pista" id="bPista">Pista</button>
  </header>
  <div class="cw" id="cw"></div>
</section>

<div id="modal"><div id="mbox"></div></div>

<script>
{
const VERSION='2.1';
const $=id=>document.getElementById(id);

/* ================= AZAR CON SEMILLA ================= */
let rng=Math.random;
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
const ri=n=>Math.floor(rng()*n),pick=a=>a[ri(a.length)];
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=ri(i+1);[a[i],a[j]]=[a[j],a[i]];}return a;}
function perms(n){const res=[],p=[...Array(n).keys()];const rec=k=>{if(k===n){res.push(p.slice());return;}for(let i=k;i<n;i++){[p[k],p[i]]=[p[i],p[k]];rec(k+1);[p[k],p[i]]=[p[i],p[k]];}};rec(0);return res;}

/* ================= PERSONAJES ================= */
const HOMBRES=[{n:'Sr. Gil',o:'panadero'},{n:'Sr. Ortega',o:'cartero'},{n:'Sr. Molina',o:'herrero'},{n:'Sr. Pardo',o:'maestro'},
 {n:'Sr. Benítez',o:'alcalde'},{n:'Sr. Castro',o:'pescadero'},{n:'Sr. Ríos',o:'molinero'},{n:'Sr. Vidal',o:'relojero'}];
const MUJERES=[{n:'Sra. Ruiz',o:'florista'},{n:'Sra. Navarro',o:'boticaria'},{n:'Sra. Mora',o:'bibliotecaria'},{n:'Sra. Lozano',o:'tabernera'},
 {n:'Sra. Prieto',o:'costurera'},{n:'Sra. Soler',o:'veterinaria'},{n:'Sra. Campos',o:'pastelera'},{n:'Sra. Iglesias',o:'fotógrafa'}];
const PELOS=['moreno','rubio','pelirrojo','canoso'];
const HAIR={moreno:'#3b2a20',rubio:'#e8c25a',pelirrojo:'#c4562b',canoso:'#d3d3d3'};
const PIEL=['#f1c27d','#e0ac69','#ffdbac','#c68642','#8d5524'];
const ROPA=['#3d7ea6','#c0392b','#2f9e6e','#8e44ad','#d35400','#34495e','#16a085','#b7950b'];
const FONDO=['#fde7a8','#cfe9f5','#d8f0d2','#f9d6d0','#e5dcf5','#ffe0b8'];
const TRS=[
 {test:s=>s.gafas,pos:'lleva gafas',neg:'no lleva gafas'},
 {test:s=>s.sombrero,pos:'lleva sombrero',neg:'no lleva sombrero'},
 {test:s=>s.bigote,pos:'tiene bigote',neg:'no tiene bigote'},
 {test:s=>s.mujer,pos:'es una mujer',neg:'es un hombre'},
 ...PELOS.map(c=>({test:s=>s.pelo===c,pos:'tiene el pelo '+c,neg:'no tiene el pelo '+c}))];

/* ================= CAPÍTULOS ================= */
const CAP1={id:1,nombre:'Villaluz',titulo:'Capítulo 1 · Villaluz',sub:'Diez robos en el pueblo y la caja fuerte del molino.',noche:false,
 lugares:[{k:'panaderia',n:'Panadería',en:'en la panadería',ja:'junto a la panadería'},{k:'plaza',n:'Plaza',en:'en la plaza',ja:'junto a la plaza'},
  {k:'estacion',n:'Estación',en:'en la estación',ja:'junto a la estación'},{k:'biblioteca',n:'Biblioteca',en:'en la biblioteca',ja:'junto a la biblioteca'},
  {k:'mercado',n:'Mercado',en:'en el mercado',ja:'junto al mercado'},{k:'molino',n:'Molino',en:'en el molino',ja:'junto al molino'},
  {k:'taberna',n:'Taberna',en:'en la taberna',ja:'junto a la taberna'},{k:'botica',n:'Botica',en:'en la botica',ja:'junto a la botica'}],
 objetos:[{n:'Paraguas',a:'el paraguas'},{n:'Linterna',a:'la linterna'},{n:'Bastón',a:'el bastón'},{n:'Cesta',a:'la cesta'},
  {n:'Llave inglesa',a:'la llave inglesa'},{n:'Violín',a:'el violín'},{n:'Pala',a:'la pala'}],
 horas:[],
 robos:['la tarta del concurso de repostería','el gallo de la veleta','el reloj del ayuntamiento','el trofeo de petanca','las llaves del molino',
  'el retrato del alcalde','la receta secreta de la panadería','el bombín del alcalde','la recaudación de las fiestas','el jamón de la rifa','la campanilla del colegio','el queso premiado'],
 niveles:[
  {mode:'q',n:4,min:1,max:3},{mode:'q',n:6,min:2,max:4},{mode:'q',n:8,min:3,max:5},
  {mode:'x',dims:'p',n:3,types:'ABC',min:2,max:4},{mode:'x',dims:'p',n:3,types:'BC',min:2,max:5},{mode:'x',dims:'p',n:4,types:'ABC',min:3,max:6},
  {mode:'x',dims:'po',n:3,types:'ABCDEF',min:3,max:6},{mode:'x',dims:'p',n:4,types:'BC',min:3,max:7},{mode:'x',dims:'po',n:3,types:'BCEF',min:3,max:7},
  {mode:'x',dims:'po',n:4,types:'ABCDEF',min:4,max:9},{mode:'lock'}],
 diario:null,

function retrato(s){
 const hc=HAIR[s.pelo],sk=s.piel;let g=`<rect width="100" height="100" fill="${s.fondo}"/>`;
 if(s.mujer)g+=`<path d="M27 45 Q25 80 35 86 L65 86 Q75 80 73 45 Z" fill="${hc}"/>`;
 g+=`<path d="M14 100 Q18 75 50 73 Q82 75 86 100 Z" fill="${s.ropa}"/><path d="M42 74 L50 86 L58 74Z" fill="#fff" opacity=".85"/>`;
 g+=`<rect x="44" y="62" width="12" height="13" fill="${sk}"/><circle cx="30" cy="48" r="4" fill="${sk}"/><circle cx="70" cy="48" r="4" fill="${sk}"/>`;
 g+=`<ellipse cx="50" cy="46" rx="20" ry="23" fill="${sk}"/>`;
 if(!s.sombrero)g+=s.mujer?`<path d="M29 47 Q27 21 50 20 Q73 21 71 47 Q67 31 50 30 Q34 31 29 47Z" fill="${hc}"/>`
  :`<path d="M30 42 Q30 21 50 21 Q70 21 70 42 Q65 30 50 31 Q37 30 30 42Z" fill="${hc}"/>`;
 const ce=s.pelo==='canoso'?'#9a9a9a':(s.pelo==='rubio'?'#b08a2a':'#3b2a20');
 g+=`<path d="M39 39 h7 M54 39 h7" stroke="${ce}" stroke-width="2.4" stroke-linecap="round"/>`;
 g+=`<circle cx="43" cy="46" r="2.3" fill="#222"/><circle cx="57" cy="46" r="2.3" fill="#222"/>`;
 g+=`<path d="M50 48 q-3 6 1 7" fill="none" stroke="rgba(0,0,0,.3)" stroke-width="1.6"/>`;
 g+=`<path d="M44 61 q6 4 12 0" fill="none" stroke="${s.mujer?'#c0392b':'#7a3b2e'}" stroke-width="${s.mujer?2.6:2}" stroke-linecap="round"/>`;
 if(s.bigote)g+=`<path d="M40 58 q10 -6 20 0 q-10 4 -20 0Z" fill="${s.pelo==='canoso'?'#bdbdbd':hc}" stroke="rgba(0,0,0,.25)" stroke-width=".6"/>`;
 if(s.gafas)g+=`<g fill="rgba(255,255,255,.25)" stroke="#222" stroke-width="2"><circle cx="43" cy="46" r="6.2"/><circle cx="57" cy="46" r="6.2"/></g><path d="M49 46 h2 M37 45 l-6 -2 M63 45 l6 -2" stroke="#222" stroke-width="2"/>`;
 if(s.sombrero)g+=s.mujer?`<ellipse cx="50" cy="27" rx="32" ry="7" fill="#b5651d"/><path d="M36 27 Q36 9 50 9 Q64 9 64 27Z" fill="#c97a2b"/><rect x="36" y="20" width="28" height="4" fill="#e85d75"/><circle cx="63" cy="22" r="4" fill="#f7c6d0"/>`
  :`<ellipse cx="50" cy="28" rx="27" ry="5" fill="#2d2d2d"/><path d="M34 28 Q34 7 50 7 Q66 7 66 28Z" fill="#3a3a3a"/><rect x="34" y="21" width="32" height="4" fill="#8b1e1e"/>`;
 return `<svg viewBox="0 0 100 100" aria-hidden="true">${g}</svg>`;}

function hacerSospechosos(n){
 const out=[],usados=new Set(),claves=new Set();let guard=0;
 while(out.length<n&&guard++<5000){const mujer=rng()<.5,base=pick(mujer?MUJERES:HOMBRES);if(usados.has(base.n))continue;
  const s={nombre:base.n,oficio:base.o,mujer,pelo:pick(PELOS),gafas:rng()<.45,sombrero:rng()<.4,bigote:!mujer&&rng()<.5,piel:pick(PIEL),ropa:pick(ROPA),fondo:pick(FONDO)};
  const k=[s.mujer,s.pelo,s.gafas,s.sombrero,s.bigote].join();if(claves.has(k))continue;usados.add(base.n);claves.add(k);out.push(s);}
 return out;}
const FRASES=['Un testigo asegura que el culpable %.','Una vecina vio que el culpable %.','Está claro que el culpable %.','El perro del alcalde olfateó que el culpable %.'];

function genQ(cfg,cap){
 let mejor=null;
 for(let at=0;at<80;at++){
  const sus=hacerSospechosos(cfg.n),cu=ri(cfg.n);
  const pool=shuffle(TRS.map(tr=>({tr,v:tr.test(sus[cu])})));
  const vale=cl=>[...Array(cfg.n).keys()].filter(i=>cl.every(c=>c.tr.test(sus[i])===c.v)).length===1;
  let cands=[...Array(cfg.n).keys()],ch=[];
  for(const c of pool){if(cands.length===1)break;const nc=cands.filter(i=>c.tr.test(sus[i])===c.v);if(nc.length<cands.length){cands=nc;ch.push(c);}}
  if(cands.length!==1)continue;
  for(let i=ch.length-1;i>=0;i--){const r=ch.slice(0,i).concat(ch.slice(i+1));if(vale(r))ch=r;}
  const caso={mode:'q',sus,cu,clues:ch.map(c=>pick(FRASES).replace('%',c.v?c.tr.pos:c.tr.neg)),robo:pick(cap.robos),escena:pick(cap.lugares).k};
  if(ch.length>=cfg.min&&ch.length<=cfg.max)return caso;if(!mejor)mejor=caso;}
 return mejor;}

/* Átomos: afirmaciones verdaderas o falsas sobre un reparto (c.pl lugar, c.ob objeto, c.hr hora de cada sospechoso).
   Tipos: A/B lugar · C rasgos · D/B objeto · E objeto-lugar · F objeto-rasgo · H hora · I relaciones de hora · N plano/vecinos */
function atomos(k){
 const {n,sus,lug,obj,horas,cp,cu,hasO,hasH}=k,A=[];
 const S=i=>sus[i].nombre,Pl=j=>lug[j].en,J=j=>lug[j].ja,O=o=>obj[o].a,H=h=>'a las '+horas[h];
 const add=(kp,kn,about,tp,tn,f,direct)=>{A.push({k:kp,about,t:tp,f,direct:!!direct});if(tn)A.push({k:kn,about,t:tn,f:c=>!f(c)});};
 const who=p=>p===cp?'El culpable':'Quien estaba '+Pl(p);
 for(let s=0;s<n;s++)for(let p=0;p<n;p++)add('A','B',[s],`${S(s)} estaba ${Pl(p)}.`,`${S(s)} no estaba ${Pl(p)}.`,c=>c.pl[s]===p,s===cu&&p===cp);
 for(let p=0;p<n;p++)for(const tr of TRS)add('C','C',[],`${who(p)} ${tr.pos}.`,`${who(p)} ${tr.neg}.`,c=>tr.test(sus[c.pl.indexOf(p)]));
 if(hasO){
  for(let s=0;s<n;s++)for(let o=0;o<n;o++)add('D','B',[s],`${S(s)} llevaba ${O(o)}.`,`${S(s)} no llevaba ${O(o)}.`,c=>c.ob[s]===o);
  for(let o=0;o<n;o++)for(let p=0;p<n;p++)add('E','E',[],`Quien llevaba ${O(o)} estaba ${Pl(p)}.`,`Quien llevaba ${O(o)} no estaba ${Pl(p)}.`,c=>c.pl[c.ob.indexOf(o)]===p);
  for(let o=0;o<n;o++)for(const tr of TRS)add('F','F',[],`Quien llevaba ${O(o)} ${tr.pos}.`,`Quien llevaba ${O(o)} ${tr.neg}.`,c=>tr.test(sus[c.ob.indexOf(o)]));}
 if(hasH){
  for(let s=0;s<n;s++)for(let h=0;h<n;h++)add('H','H',[s],`${S(s)} llegó ${H(h)}.`,`${S(s)} no llegó ${H(h)}.`,c=>c.hr[s]===h);
  for(let s=0;s<n;s++)for(let s2=s+1;s2<n;s2++)add('I','I',[s,s2],`${S(s)} llegó antes que ${S(s2)}.`,`${S(s)} llegó después que ${S(s2)}.`,c=>c.hr[s]<c.hr[s2]);
  for(let s=0;s<n;s++)for(let s2=0;s2<n;s2++)if(s!==s2)add('I','I',[s,s2],`${S(s)} llegó justo una hora antes que ${S(s2)}.`,`${S(s)} no llegó justo una hora antes que ${S(s2)}.`,c=>c.hr[s2]-c.hr[s]===1);
  for(let h=0;h<n;h++)for(let p=0;p<n;p++)add('I','I',[],`Quien llegó ${H(h)} estaba ${Pl(p)}.`,`Quien llegó ${H(h)} no estaba ${Pl(p)}.`,c=>c.pl[c.hr.indexOf(h)]===p);
  if(hasO)for(let h=0;h<n;h++)for(let o=0;o<n;o++)add('I','I',[],`Quien llegó ${H(h)} llevaba ${O(o)}.`,`Quien llegó ${H(h)} no llevaba ${O(o)}.`,c=>c.ob[c.hr.indexOf(h)]===o);
  for(let h=0;h<n;h++)for(const tr of TRS)add('I','I',[],`Quien llegó ${H(h)} ${tr.pos}.`,`Quien llegó ${H(h)} ${tr.neg}.`,c=>tr.test(sus[c.hr.indexOf(h)]));
  for(let s=0;s<n;s++)add('I','I',[s],`El culpable llegó antes que ${S(s)}.`,null,c=>c.hr[c.pl.indexOf(cp)]<c.hr[s]);}
 for(let s=0;s<n;s++)for(let p=0;p<n;p++)add('N','N',[s],`${S(s)} estaba ${J(p)}.`,`${S(s)} no estaba ${J(p)}.`,c=>Math.abs(c.pl[s]-p)===1);
 for(let s=0;s<n;s++)for(let s2=s+1;s2<n;s2++){
  add('N','N',[s,s2],`${S(s)} y ${S(s2)} estaban en sitios vecinos.`,`${S(s)} y ${S(s2)} no estaban en sitios vecinos.`,c=>Math.abs(c.pl[s]-c.pl[s2])===1);
  add('N','N',[s,s2],`${S(s)} estaba más cerca de la entrada que ${S(s2)}.`,`${S(s)} estaba más lejos de la entrada que ${S(s2)}.`,c=>c.pl[s]<c.pl[s2]);}
 if(hasO)for(let o=0;o<n;o++)for(let p=0;p<n;p++)add('N','N',[],`Quien llevaba ${O(o)} estaba ${J(p)}.`,`Quien llevaba ${O(o)} no estaba ${J(p)}.`,c=>Math.abs(c.pl[c.ob.indexOf(o)]-p)===1);
 return A;}

function genX(cfg,cap){
 const n=cfg.n,hasO=cfg.dims.includes('o'),hasH=cfg.dims.includes('h'),T=cfg.types;
 const PP=perms(n),all=[];
 for(const a of PP)for(const b of (hasO?PP:[null]))for(const h of (hasH?PP:[null]))all.push({pl:a,ob:b,hr:h});
 let mejor=null;const intentos=all.length>5000?24:60;
 for(let at=0;at<intentos;at++){
  const sus=hacerSospechosos(n),lug=shuffle(cap.lugares.slice()).slice(0,n),obj=hasO?shuffle(cap.objetos.slice()).slice(0,n):null,horas=hasH?cap.horas.slice(0,n):null;
  const sol={pl:shuffle([...Array(n).keys()]),ob:hasO?shuffle([...Array(n).keys()]):null,hr:hasH?shuffle([...Array(n).keys()]):null};
  const cp=ri(n),cu=sol.pl.indexOf(cp);
  const atoms=atomos({n,sus,lug,obj,horas,cp,cu,hasO,hasH});atoms.forEach(a=>a.v=a.f(sol));
  const tests=[];
  if(cfg.liar){let ok=true;const usados=new Set();
   for(let i=0;i<n;i++){const op=atoms.filter(a=>!a.about.includes(i)&&a.v===(i!==cu)&&T.includes(a.k)&&a.k!=='C'&&!a.direct&&!usados.has(a.t));
    if(!op.length){ok=false;break;}const a=pick(op);usados.add(a.t);tests.push({i,a});}
   if(!ok)continue;}
  const culp=c=>c.pl.indexOf(cp);
  const ans=c=>{const k=culp(c);return k+'_'+(c.ob?c.ob[k]:'')+'_'+(c.hr?c.hr[k]:'');};
  const unico=set=>set.length>0&&set.every(c=>ans(c)===ans(set[0]));
  const base=all.filter(c=>{const k=culp(c);return tests.every(({i,a})=>a.f(c)===(i!==k));});
  const pool=shuffle(atoms.filter(a=>a.v&&T.includes(a.k)&&!a.direct));
  let cands=base,ch=[];
  for(const a of pool){if(unico(cands))break;const nc=cands.filter(a.f);if(nc.length<cands.length){cands=nc;ch.push(a);}}
  if(!unico(cands))continue;
  shuffle(ch);
  for(let i=ch.length-1;i>=0;i--){const r=ch.slice(0,i).concat(ch.slice(i+1));if(unico(base.filter(c=>r.every(q=>q.f(c)))))ch=r;}
  const caso={mode:'x',dims:cfg.dims,n,sus,lug,obj,horas,sol,cp,cu,liar:!!cfg.liar,adj:T.includes('N'),
   clues:ch.map(a=>a.t),tests:tests.map(({i,a})=>({i,t:a.t})),robo:pick(cap.robos),escena:lug[cp].k};
  if(ch.length>=cfg.min&&ch.length<=cfg.max)return caso;
  if(!mejor||Math.abs(ch.length-cfg.min)<Math.abs(mejor.clues.length-cfg.min))mejor=caso;}
 return mejor;}

function genLock(spec){
 const codes=[];const rec=cur=>{if(cur.length===spec.len){codes.push(cur.slice());return;}for(let d=0;d<spec.alpha;d++)if(!cur.includes(d)){cur.push(d);rec(cur);cur.pop();}};rec([]);
 const fb=(g,s)=>{let bien=0,mal=0;g.forEach((d,i)=>{if(s[i]===d)bien++;else if(s.includes(d))mal++;});return bien+','+mal;};
 const [lo,hi]=spec.len===3?[4,5]:[4,6];let mejor=null;
 for(let at=0;at<80;at++){
  const sec=pick(codes);let cands=codes,ch=[];
  for(let k=0;k<500&&cands.length>1;k++){const g=pick(codes);const f=fb(g,sec);const nc=cands.filter(c=>fb(g,c)===f);if(nc.length<cands.length){cands=nc;ch.push({g,f});}}
  if(cands.length!==1)continue;
  for(let i=ch.length-1;i>=0;i--){const r=ch.slice(0,i).concat(ch.slice(i+1));if(codes.filter(c=>r.every(h=>fb(h.g,c)===h.f)).length===1)ch=r;}
  const caso={mode:'lock',sec,hints:ch,spec};if(ch.length>=lo&&ch.length<=hi)return caso;if(!mejor||ch.length<mejor.hints.length)mejor=caso;}
 return mejor;}
function textoPista(f,tipo){const [b,m]=f.split(',').map(Number),fem=tipo==='cifra';
 if(!b&&!m)return fem?'Ninguna cifra es correcta.':'Ningún símbolo es correcto.';
 const uno=fem?'una cifra es correcta':'un símbolo es correcto',var_=x=>x+(fem?' cifras son correctas':' símbolos son correctos');
 const p=[];
 if(b)p.push((b===1?uno+' y está bien colocad':var_(b)+' y están bien colocad')+(fem?'a':'o')+(b>1?'s':''));
 if(m)p.push((m===1?uno+' pero está mal colocad':var_(m)+' pero están mal colocad')+(fem?'a':'o')+(m>1?'s':''));
 const t=p.join('; ');return t[0].toUpperCase()+t.slice(1)+'.';}

let G=null;
function empezar(capId,i,seed,dia){
 const cap=CAPS[capId],cfg=dia?dia.cfg:cap.niveles[i];
 const sd=seed??(capId*100000+1000+i*7919);rng=mulberry32(sd);
 const caso=cfg.mode==='q'?genQ(cfg,cap):cfg.mode==='lock'?genLock(cap.final):genX(cfg,cap);rng=Math.random;
 G={cap:capId,i,cfg,caso,seed:sd,dia,fallos:0,pista:false,off:new Set(),tach:new Set(),tachD:new Set(),marks:{},rueda:Array(caso.spec?caso.spec.len:3).fill(0),sel:{s:null,o:null,h:null},fin:false};
 if(caso.mode==='x'){const z=()=>Array.from({length:caso.n},()=>Array(caso.n).fill(0));G.marks.L=z();if(caso.obj)G.marks.O=z();if(caso.horas)G.marks.H=z();}
 document.documentElement.classList.toggle('noche',cap.noche);
 $('cNum').textContent=dia?'Caso del día · '+dia.fecha:(cfg.mode==='lock'?cap.titulo+' · final':cap.titulo.split(' · ')[0]+' · Caso '+(i+1)+' de '+(cap.niveles.length-1)+' · '+tipoDe(cfg,cap));
 $('cTit').textContent=cfg.mode==='lock'?cap.final.tit:titulo(caso.robo);
 $('bPista').style.display=cfg.mode==='lock'?'none':'';
 pintarCaso();show('caso');}
const titulo=r=>{const t='El caso de '+r;return t.length>48?t.slice(0,46)+'…':t;};
function estrellas(){return Math.max(1,3-G.fallos-(G.pista?1:0));}
function pintarEst(){const e=estrellas();$('cEst').innerHTML='<i>'+'★'.repeat(e)+'</i>'+'☆'.repeat(3-e);}
function pregunta(c){if(c.mode==='q')return'¿Quién fue?';const o=!!c.obj,h=!!c.horas;
 return '¿Quién fue'+(o&&h?', qué llevaba y a qué hora llegó?':o?' y qué llevaba?':h?' y a qué hora llegó?':'?');}

function pintarCaso(){
 pintarEst();const c=G.caso,cw=$('cw'),cap=CAPS[G.cap];
 if(c.mode==='lock'){pintarCandado();return;}
 const diario=cap.diario&&!G.dia&&cap.diario[G.i]?`<p class="diario">Diario del inspector: ${cap.diario[G.i]}</p>`:'';
 const reparto=c.mode==='x'?'Cada sospechoso estaba en un lugar distinto'+(c.obj&&c.horas?', llevaba un objeto distinto y llegó a una hora distinta':c.obj?' y llevaba un objeto distinto':c.horas?' y llegó a una hora distinta':'')+'.':'';
 const historia=c.mode==='q'
  ?`${diario}<h3>${pregunta(c)}</h3><p>Ha desaparecido <b>${c.robo}</b>. El culpable huyó corriendo, pero varios vecinos lo vieron. Descarta sospechosos con las pistas hasta que solo quede uno.</p>`
  :`${diario}<h3>${pregunta(c)}</h3><p>Ha desaparecido <b>${c.robo}</b>. ${reparto} Usa las pistas y la libreta para averiguarlo.</p><span class="lugar">El robo ocurrió ${c.lug[c.cp].en}</span>`
   +(c.liar?'<div class="regla">Regla: el culpable miente en su declaración. Los inocentes dicen la verdad.</div>':'');
 const plano=c.adj?`<h3 class="secT">Plano de la feria <small>los puestos están en este orden</small></h3><div class="plano"><span class="ent">Entrada</span><i>›</i>${c.lug.map(l=>`<span class="pst">${l.n}</span>`).join('<i>›</i>')}</div>`:'';
 const fichas=c.sus.map((s,i)=>`<button class="card${G.off.has(i)?' off':''}" data-s="${i}">${retrato(s)}<b>${s.nombre}</b><small>${s.oficio}</small><div class="tr">${rasgos(s)}</div></button>`).join('');
 const decl=c.liar?`<h3 class="secT">Declaraciones <small>toca para tacharlas</small></h3><ul class="decl">${c.tests.map((d,k)=>`<li data-d="${k}" class="${G.tachD.has(k)?'tach':''}">${retrato(c.sus[d.i])}<div><b>${c.sus[d.i].nombre} declara:</b><q>${d.t}</q></div></li>`).join('')}</ul>`:'';
 const pistas=c.clues.map((t,i)=>`<li data-c="${i}" class="${G.tach.has(i)?'tach':''}">${t}</li>`).join('');
 let libreta='';
 if(c.mode==='x')libreta='<h3 class="secT">Libreta <small>1 toque: ✕ · 2 toques: ✓ · 3 toques: vacío</small></h3><div class="note">'+tabla('L','Lugares',c.lug.map(l=>l.n))+(c.obj?tabla('O','Objetos',c.obj.map(o=>o.n)):'')+(c.horas?tabla('H','Horas de llegada',c.horas):'')+'</div>';
 cw.innerHTML=`<div class="scene">${escena(c.escena,cap.noche)}</div><div class="colL"><section class="paper story">${historia}</section>${plano}
  <h3 class="secT">Sospechosos <small>toca una ficha para descartarla</small></h3><div class="sus">${fichas}</div>${decl}</div>
  <div class="colR"><h3 class="secT" style="margin-top:0">Pistas <small>toca para tacharlas</small></h3><ol class="clues">${pistas||'<li>No hay más pistas: las declaraciones bastan.</li>'}</ol>${libreta}
  <div class="acc"><button class="btn rojo" id="bAcusar">Acusar</button></div></div>`;
 cw.querySelectorAll('.card').forEach(b=>b.onclick=()=>{const i=+b.dataset.s;G.off.has(i)?G.off.delete(i):G.off.add(i);b.classList.toggle('off');sfx.clic();});
 cw.querySelectorAll('.clues li[data-c]').forEach(li=>li.onclick=()=>{const i=+li.dataset.c;G.tach.has(i)?G.tach.delete(i):G.tach.add(i);li.classList.toggle('tach');sfx.clic();});
 cw.querySelectorAll('.decl li').forEach(li=>li.onclick=()=>{const i=+li.dataset.d;G.tachD.has(i)?G.tachD.delete(i):G.tachD.add(i);li.classList.toggle('tach');sfx.clic();});
 cw.querySelectorAll('.grid button').forEach(b=>b.onclick=()=>marcar(b.dataset.g,+b.dataset.r,+b.dataset.c));
 cw.querySelectorAll('.borrar').forEach(b=>b.onclick=()=>borrar(b.dataset.b));
 $('bAcusar').onclick=acusar;}
function tabla(g,nom,cols){const c=G.caso,m=G.marks[g];
 return `<div class="gBox"><div class="gHead"><span>${nom}</span><button class="borrar" data-b="${g}">Borrar</button></div><table class="grid"><tr><th></th>${cols.map(t=>`<th>${t}</th>`).join('')}</tr>`+
  c.sus.map((s,r)=>`<tr><th class="rn">${s.nombre}</th>${cols.map((_,k)=>{const v=m[r][k];
   return `<td><button data-g="${g}" data-r="${r}" data-c="${k}" class="${v===1?'x':v===3?'x a':v===2?'ok':''}" aria-label="${s.nombre} - ${cols[k]}">${v===1||v===3?'✕':v===2?'✓':''}</button></td>`;}).join('')}</tr>`).join('')+'</table></div>';}
/* 0 vacío · 1 ✕ a mano · 2 ✓ · 3 ✕ automática (se quita sola si se quita su ✓) */
function recalc(g){const m=G.marks[g],n=m.length;
 for(let r=0;r<n;r++)for(let c=0;c<n;c++)if(m[r][c]===3)m[r][c]=0;
 for(let r=0;r<n;r++)for(let c=0;c<n;c++)if(m[r][c]===2)for(let k=0;k<n;k++){if(k!==c&&m[r][k]===0)m[r][k]=3;if(k!==r&&m[k][c]===0)m[k][c]=3;}}
function marcar(g,r,c,forzar){const m=G.marks[g],v=m[r][c];m[r][c]=forzar??(v===0?1:(v===1||v===3)?2:0);recalc(g);sfx.clic();pintarCaso();}
function borrar(g){const nom={L:'lugares',O:'objetos',H:'horas'}[g];
 modal(`<h3>¿Borrar la tabla de ${nom}?</h3><p class="msg">Se quitarán todas las ✕ y ✓ de esa tabla.</p>`,
 [{t:'Sí, borrar',c:'rojo',f:()=>{G.marks[g]=G.marks[g].map(f=>f.map(()=>0));sfx.clic();pintarCaso();}},{t:'Cancelar',c:'sec'}]);}

function pedirPista(){
 if(G.fin)return;const c=G.caso;
 if(c.mode==='q'){const libres=[...Array(c.sus.length).keys()].filter(i=>i!==c.cu&&!G.off.has(i));
  if(!libres.length){modal('<h3>Sin pistas</h3><p class="msg">Ya has descartado a todos los inocentes.</p>',[{t:'Vale'}]);return;}
  const k=pick(libres);G.off.add(k);G.pista=true;pintarCaso();
  modal(`<h3>Pista del inspector</h3><p class="msg"><b>${c.sus[k].nombre}</b> tiene coartada: no pudo ser.</p>`,[{t:'Gracias'}]);return;}
 const op=[];for(let s=0;s<c.n;s++){if(s===c.cu)continue;
  if(G.marks.L[s][c.sol.pl[s]]!==2)op.push(['L',s,c.sol.pl[s],`${c.sus[s].nombre} estaba ${c.lug[c.sol.pl[s]].en}`]);
  if(c.obj&&G.marks.O[s][c.sol.ob[s]]!==2)op.push(['O',s,c.sol.ob[s],`${c.sus[s].nombre} llevaba ${c.obj[c.sol.ob[s]].a}`]);
  if(c.horas&&G.marks.H[s][c.sol.hr[s]]!==2)op.push(['H',s,c.sol.hr[s],`${c.sus[s].nombre} llegó a las ${c.horas[c.sol.hr[s]]}`]);}
 if(!op.length){modal('<h3>Sin pistas</h3><p class="msg">Tu libreta ya tiene todo lo que puedo decirte.</p>',[{t:'Vale'}]);return;}
 const [g,r,k,t]=pick(op);G.pista=true;marcar(g,r,k,2);
 modal(`<h3>Pista del inspector</h3><p class="msg">${t}. Lo he apuntado en tu libreta.</p>`,[{t:'Gracias'}]);}
function confirmarPista(){if(G.pista){pedirPista();return;}
 modal('<h3>¿Usar una pista?</h3><p class="msg">Te ayudará, pero este caso valdrá como máximo 2 estrellas.<br><small style="color:#5d717b">En la versión comercial, las pistas extra se conseguirán viendo un anuncio.</small></p>',
  [{t:'Sí, ayúdame',f:pedirPista},{t:'No',c:'sec'}]);}

function acusar(){
 const c=G.caso;G.sel={s:null,o:null,h:null};
 const html=`<h3>¿A quién acusas?</h3><div class="pickS">${c.sus.map((s,i)=>`<button data-s="${i}" style="${G.off.has(i)?'opacity:.45':''}">${retrato(s)}${s.nombre}</button>`).join('')}</div>`+
  (c.obj?`<h4>¿Qué llevaba?</h4><div class="pickO" data-g="o">${c.obj.map((o,i)=>`<button data-v="${i}">${o.n}</button>`).join('')}</div>`:'')+
  (c.horas?`<h4>¿A qué hora llegó?</h4><div class="pickO" data-g="h">${c.horas.map((h,i)=>`<button data-v="${i}">${h}</button>`).join('')}</div>`:'');
 modal(html,[{t:'Confirmar acusación',c:'rojo',id:'bConf',dis:true,f:resolver},{t:'Cancelar',c:'sec'}]);
 const upd=()=>{$('bConf').disabled=G.sel.s===null||(c.obj&&G.sel.o===null)||(c.horas&&G.sel.h===null);};
 document.querySelectorAll('.pickS button').forEach(b=>b.onclick=()=>{document.querySelectorAll('.pickS button').forEach(x=>x.classList.remove('sel'));b.classList.add('sel');G.sel.s=+b.dataset.s;sfx.clic();upd();});
 document.querySelectorAll('.pickO').forEach(w=>w.querySelectorAll('button').forEach(b=>b.onclick=()=>{w.querySelectorAll('button').forEach(x=>x.classList.remove('sel'));b.classList.add('sel');G.sel[w.dataset.g]=+b.dataset.v;sfx.clic();upd();}));}

function resolver(){
 const c=G.caso,{s,o,h}=G.sel;
 const okS=s===c.cu,okO=!c.obj||o===c.sol.ob[c.cu],okH=!c.horas||h===c.sol.hr[c.cu];
 if(!(okS&&okO&&okH)){G.fallos++;sfx.mal();pintarEst();
  const fallo=!okS?`<b>${c.sus[s].nombre}</b> es inocente.`:'Has acertado el culpable, pero '+(!okO&&!okH?'no el objeto ni la hora.':!okO?'no el objeto.':'no la hora de llegada.');
  modal(`<h3 style="color:var(--rojo)">¡Error, inspector!</h3><p class="msg">${fallo} Repasa las pistas.</p>`,[{t:'Seguir investigando'}]);
  if(!okS){G.off.add(s);pintarCaso();}return;}
 const q=c.sus[c.cu];
 const res=`Fue <b>${q.nombre}</b> (${q.oficio})`+(c.lug?`, que estaba ${c.lug[c.cp].en}`:'')+(c.obj?` con ${c.obj[c.sol.ob[c.cu]].a}`:'')+(c.horas?` y llegó a las ${c.horas[c.sol.hr[c.cu]]}`:'')+'.'
  +(c.liar?`<br><small style="color:#5d717b">Su declaración era la mentira: «${c.tests.find(d=>d.i===c.cu).t}»</small>`:'');
 ganar(res);}

function ganar(res){
 G.fin=true;sfx.bien();const e=estrellas(),i=G.i,cap=CAPS[G.cap],sv=save.caps[G.cap];
 if(G.dia)save.dia[G.dia.fecha]=Math.max(save.dia[G.dia.fecha]||0,e);
 else{sv.stars[i]=Math.max(sv.stars[i]||0,e);if(sv.unlocked<i+2&&i+1<cap.niveles.length)sv.unlocked=i+2;}
 guardar();
 const ult=!G.dia&&i===cap.niveles.length-1;const bts=[];
 if(!G.dia&&!ult)bts.push({t:'Siguiente ›',f:()=>empezar(G.cap,i+1,null)});
 if(ult&&CAPS[G.cap+1])bts.push({t:'Ir al capítulo '+(G.cap+1)+' ›',f:()=>{capSel=G.cap+1;pintarMapa();show('map');}});
 if(G.cfg.mode!=='lock')bts.push({t:'Otro caso parecido',c:'sec',f:()=>empezar(G.cap,i,Math.floor(Math.random()*1e9),G.dia?{cfg:G.cfg,fecha:G.dia.fecha.replace(' (extra)','')+' (extra)'}:null)});
 bts.push({t:G.dia?'Inicio':'Mapa',c:'sec',f:()=>{if(G.dia)show('menu');else{capSel=G.cap;pintarMapa();show('map');}}});
 modal(`<h3 style="color:var(--verde)">${G.cfg.mode==='lock'?'¡Abierto!':'¡Caso resuelto!'}</h3><div class="estr"><i>${'★'.repeat(e)}</i>${'★'.repeat(3-e)}</div><p class="msg">${res}</p>`+
  (ult?`<p class="msg">${cap.final.fin}</p>`:''),bts);}

/* ================= CANDADO ================= */
function pintarCandado(){
 const c=G.caso,cw=$('cw'),cap=CAPS[G.cap],sp=c.spec,simb=sp.tipo!=='cifra';
 const ver=d=>simb?simbolo(d):d;
 cw.innerHTML=`<div class="scene">${escena(sp.escena,cap.noche)}</div><div class="colL"><section class="paper story"><h3>${sp.tit}</h3><p>${sp.intro}</p></section>
  <h3 class="secT">Notas encontradas</h3><div class="lockBox">${c.hints.map(h=>`<div class="hintRow"><div class="dig">${h.g.map(d=>`<span>${ver(d)}</span>`).join('')}</div><p>${textoPista(h.f,sp.tipo)}</p></div>`).join('')}</div></div>
  <div class="colR"><h3 class="secT" style="margin-top:0">Combinación${simb?' <small>símbolos posibles: '+[...Array(sp.alpha).keys()].map(d=>`<span style="display:inline-block;width:20px;vertical-align:middle">${simbolo(d)}</span>`).join('')+'</small>':''}</h3>
  <div class="lockBox"><div class="safe">${[...Array(sp.len).keys()].map(k=>`<div class="wheel"><button data-k="${k}" data-d="1" aria-label="Siguiente">▲</button><span id="w${k}">${ver(G.rueda[k])}</span><button data-k="${k}" data-d="-1" aria-label="Anterior">▼</button></div>`).join('')}</div>
  <button class="btn rojo" id="bAbrir" style="font-size:22px;padding:14px 44px">Abrir</button></div></div>`;
 cw.querySelectorAll('.wheel button').forEach(b=>b.onclick=()=>{const k=+b.dataset.k;G.rueda[k]=(G.rueda[k]+(+b.dataset.d)+sp.alpha)%sp.alpha;$('w'+k).innerHTML=ver(G.rueda[k]);sfx.tic();});
 $('bAbrir').onclick=()=>{if(G.rueda.every((d,k)=>d===c.sec[k]))ganar('La combinación era '+c.sec.map(d=>simb?`<span style="display:inline-block;width:28px;vertical-align:middle">${simbolo(d)}</span>`:d).join('')+'.');
  else{G.fallos++;sfx.mal();pintarEst();modal('<h3 style="color:var(--rojo)">No se abre</h3><p class="msg">Esa combinación no es correcta. Revisa las notas.</p>',[{t:'Seguir'}]);}};}

/* ================= EVENTOS ================= */
$('bJugar').onclick=()=>{pintarMapa();show('map');};
$('bMapMenu').onclick=()=>{document.documentElement.classList.remove('noche');show('menu');};
$('bSon').onclick=()=>setSon(!son);
$('bPista').onclick=confirmarPista;
$('bBack').onclick=()=>{if(G&&G.dia){document.documentElement.classList.remove('noche');show('menu');}else{capSel=G.cap;pintarMapa();show('map');}};
$('bDia').onclick=()=>{const d=new Date(),fecha=d.toLocaleDateString('es-ES');
 const sd=d.getFullYear()*10000+(d.getMonth()+1)*100+d.getDate();const capId=sd%2?2:1;const cap=CAPS[capId];
 const pool=capId===2?cap.niveles.slice(1,12):cap.niveles.slice(5,10);empezar(capId,-1,sd,{cfg:pool[sd%pool.length],fecha});};
setSon(son);

/* ================= APP INSTALABLE (PWA) ================= */
const standalone=window.matchMedia('(display-mode: standalone)').matches||navigator.standalone===true;
if('serviceWorker' in navigator&&(location.protocol==='https:'||location.hostname==='localhost'))window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
let aviso=null;
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();aviso=e;$('instalar').style.display='';});
$('instalar').onclick=async()=>{if(!aviso)return;aviso.prompt();try{await aviso.userChoice;}catch(e){}aviso=null;$('instalar').style.display='none';};
window.addEventListener('appinstalled',()=>{$('instalar').style.display='none';});
const esIOS=/iphone|ipad|ipod/i.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
if(esIOS&&!standalone)$('iosTip').style.display='block';
}
</script>
